plugins { id 'com.android.application' }

android {
    namespace 'com.arpitagarwala.widgets'
    compileSdk 35
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    defaultConfig {
        applicationId 'com.arpitagarwala.widgets'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1'
    }
    signingConfigs {
        release {
            storeFile file(System.getenv('ARPIT_WIDGET_KEYSTORE') ?: 'missing-keystore')
            storePassword System.getenv('ARPIT_WIDGET_KEY_PASSWORD')
            keyAlias 'arpit-widgets'
            keyPassword System.getenv('ARPIT_WIDGET_KEY_PASSWORD')
        }
    }
    buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
    testOptions { unitTests.includeAndroidResources = true }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
